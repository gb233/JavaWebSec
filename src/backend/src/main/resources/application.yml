# Global configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/security_teaching_system?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&connectionCollation=utf8mb4_unicode_ci&useOldAliasMetadataBehavior=true&autoReconnect=true&useSSL=false&characterSetResults=utf8mb4&useLocalSessionState=true&useCompression=true&characterSetClient=utf8mb4&characterSetConnection=utf8mb4&useOldAliasMetadataBehavior=true&useCompression=true&useLocalSessionState=true&useSSL=false&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: SecurityTeachingSystemPool
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: false # Unified auto-commit setting
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

  jpa:
    hibernate:
      ddl-auto: update  # 开发环境使用update，生产环境使用validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      jdbc:
        batch_size: 20
        batch_versioned_data: true
      order_inserts: true
      order_updates: true
      connection:
        provider_disables_autocommit: true # Unified Hibernate auto-commit setting
      query:
        conventional_java_constants: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # SQL初始化配置（Spring Boot标准机制）
  sql:
    init:
      mode: always  # 总是执行初始化脚本（首次启动时）
      schema-locations: classpath:schema.sql  # 表结构脚本
      data-locations: classpath:data.sql  # 初始数据脚本
      continue-on-error: false  # 遇到错误时停止
      separator: ;  # SQL语句分隔符

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
      roles: ADMIN

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      write-null-map-values: false
      write-empty-json-arrays: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  cache:
    type: simple
    cache-names:
      - vulnerabilityCategories
      - vulnerabilityContent
      - userProfiles

# Application specific configuration
app:
  jwt:
    secret: mySecretKey
    expiration: 86400000 # 24 hours
    refresh-expiration: 604800000 # 7 days
  
  cors:
    allowed-origins: 
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

  security:
    password:
      min-length: 6
      require-uppercase: false
      require-lowercase: false
      require-digit: false
      require-special: false
    
    session:
      timeout: 1800 # 30 minutes
      max-sessions: 10

  knowledge:
    cache:
      categories-ttl: 3600 # 1 hour
      content-ttl: 1800 # 30 minutes
    
    pagination:
      default-size: 20
      max-size: 100

  monitoring:
    attack-log:
      enabled: true
      retention-days: 30
      batch-size: 100
    
    performance:
      enabled: true
      slow-query-threshold: 1000 # ms

# Logging configuration
logging:
  level:
    com.javaweb.security: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.javaweb.security.mapper: DEBUG
    com.javaweb.security.monitoring: INFO
    com.zaxxer.hikari: INFO
    org.springframework.web.servlet.DispatcherServlet: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/security_teaching_system?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&connectionCollation=utf8mb4_unicode_ci&useOldAliasMetadataBehavior=true&autoReconnect=true&useSSL=false&characterSetResults=utf8mb4&useLocalSessionState=true&useCompression=true&characterSetClient=utf8mb4&characterSetConnection=utf8mb4&useOldAliasMetadataBehavior=true&useCompression=true&useLocalSessionState=true&useSSL=false&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  logging:
    level:
      com.javaweb.security: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://yourdomain.com}
  demo:
    seed-knowledge: true
    seed-test-data: true
    seed-challenge-data: false

---
# Test profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

logging:
  level:
    com.javaweb.security: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/security_teaching_system?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.javaweb.security: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    root: WARN