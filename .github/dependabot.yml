# Dependabot配置 - 自动依赖更新和安全修复
# 文档: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Maven依赖更新
  - package-ecosystem: "maven"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "javaweb-security"
    labels:
      - "dependencies"
      - "backend"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # 忽略Spring Boot主版本更新（需要手动处理）
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # 忽略Java版本更新
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        versions: ["3.x"]

  # npm依赖更新
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "javaweb-security"
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # 忽略Vue 4.x主版本更新
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      # 忽略TypeScript主版本更新
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker依赖更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

